<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        <form id="transaction-form">
            <div class="form-group">
                <label for="transaction-name">Nama Transaksi</label>
                <input type="text" id="transaction-name" required>
            </div>
            <div class="form-group">
                <label for="transaction-category">Kategori</label>
                <select id="transaction-category" required>
                    <option value="">-- Pilih Kategori --</option>
                    <option value="Makanan">Makanan</option>
                    <option value="Transportasi">Transportasi</option>
                    <option value="Hiburan">Hiburan</option>
                    <option value="Belanja">Belanja</option>
                    <option value="Tagihan">Tagihan</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>
            <div class="form-group">
                <label for="transaction-amount">Jumlah (Rp)</label>
                <input type="number" id="transaction-amount" min="0" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="transaction-date">Tanggal</label>
                <input type="date" id="transaction-date" required>
            </div>
            <button type="submit">Tambah Transaksi</button>
        </form>

        <div class="summary">
            <h2>Total Pengeluaran</h2>
            <p id="total-amount">Rp 0</p>
        </div>

        <div class="filter">
            <label for="filter-category">Filter Kategori:</label>
            <select id="filter-category">
                <option value="">Semua Kategori</option>
                <option value="Makanan">Makanan</option>
                <option value="Transportasi">Transportasi</option>
                <option value="Hiburan">Hiburan</option>
                <option value="Belanja">Belanja</option>
                <option value="Tagihan">Tagihan</option>
                <option value="Lainnya">Lainnya</option>
            </select>
        </div>

        <div class="transactions">
            <h2>Daftar Transaksi</h2>
            <ul id="transaction-list"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
